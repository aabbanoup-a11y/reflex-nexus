name: Chat security regression checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/chat.functions.ts"
      - "src/lib/chat-attachment-policy.ts"
      - "src/integrations/supabase/runtime-auth.ts"
      - "src/integrations/supabase/runtime-attacher.ts"
      - "src/start.ts"
      - "scripts/chat-auth-policy-check.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/chat-security-checks.yml"

permissions:
  contents: read

jobs:
  chat-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:chat-auth-policy
      - run: npm run test:offline-planner
      - run: npm run test:companion
      - run: npm run build
