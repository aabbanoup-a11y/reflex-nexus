name: Reflex Nexus CI and Android APK

on:
  push:
    branches:
      - agent-autonomous-integrations-20261112

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: reflex-nexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Companion policy tests
        run: npm run test:companion
      - name: Offline planner tests
        run: npm run test:offline-planner
      - name: Lint
        run: npm run lint
      - name: Build web application
        run: npm run build
      - name: Upload web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reflex-nexus-web-build
          path: .output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses and install required packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        working-directory: android-companion
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: abanoubai-companion-debug-apk
          path: android-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  autonomous-merge:
    name: Merge tested update automatically
    needs: [web, android]
    if: success() && github.ref == 'refs/heads/agent-autonomous-integrations-20261112'
    runs-on: ubuntu-latest
    steps:
      - name: Download installable APK
        uses: actions/download-artifact@v4
        with:
          name: abanoubai-companion-debug-apk
          path: release-assets
      - name: Publish a permanent APK download release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK="$(find release-assets -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          gh release create "agent-build-${GITHUB_RUN_NUMBER}" "$APK" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "AbanoubAI Android test build ${GITHUB_RUN_NUMBER}" --notes "Built from ${GITHUB_SHA}. Web tests, lint, web build, and Android APK build all passed."
      - name: Create or reuse pull request and merge after successful tests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          PR_NUMBER="$(gh pr view "$HEAD_BRANCH" --json number --jq .number 2>/dev/null || true)"
          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(gh pr create --base main --head "$HEAD_BRANCH" --title "AbanoubAI autonomous tested update" --body "Automated update. Web tests, lint, production build, and Android APK build all passed before merge.")"
            PR_NUMBER="${PR_URL##*/}"
          fi
          gh pr ready "$PR_NUMBER" || true
          gh pr merge "$PR_NUMBER" --squash --delete-branch
