name: Reflex Nexus CI and Android APK

on:
  push:
    branches:
      - agent-autonomous-integrations-20261112
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: reflex-nexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Companion policy tests
        run: npm run test:companion
      - name: Offline planner tests
        run: npm run test:offline-planner
      - name: Lint
        run: npm run lint
      - name: Build web application
        run: npm run build
      - name: Upload web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reflex-nexus-web-build
          path: .output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses and install required packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        working-directory: android-companion
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: abanoubai-companion-debug-apk
          path: android-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
