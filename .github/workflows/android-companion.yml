name: Android Companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle wrapper --gradle-version 8.10.2
      - name: Validate Supabase build configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [[ -z "${SUPABASE_URL//[[:space:]]/}" ]]; then
            echo "::error::Missing required GitHub Actions secret SUPABASE_URL. Configure it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ -z "${SUPABASE_PUBLISHABLE_KEY//[[:space:]]/}" ]]; then
            echo "::error::Missing required GitHub Actions secret SUPABASE_PUBLISHABLE_KEY. Use a publishable key only; never use a service-role key in the APK."
            exit 1
          fi
      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew assembleDebug "-PSUPABASE_URL=$SUPABASE_URL" "-PSUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
      - uses: actions/upload-artifact@v7
        with:
          name: abanoubai-companion-debug-apk
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
